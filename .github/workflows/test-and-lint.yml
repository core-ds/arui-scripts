name: Run tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: yarn install and test
      run: |
        yarn install --immutable
        yarn run test
      env:
        CI: true

    - name: Check arui-scripts coverage
      if: matrix.node-version == '22.x'
      run: yarn workspace arui-scripts test:coverage
      env:
        CI: true
    - name: Upload arui-scripts coverage
      if: always() && matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: arui-scripts-coverage
        path: packages/arui-scripts/coverage/
        retention-days: 14
        if-no-files-found: ignore

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: yarn install and lint
      run: |
        yarn install --immutable
        yarn run lint
      env:
        CI: true
