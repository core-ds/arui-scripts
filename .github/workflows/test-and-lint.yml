name: Run tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: yarn install and test on TypeScript 7
      run: |
        yarn install --immutable
        yarn workspace arui-scripts node -e "const { version } = require('typescript/package.json'); if (Number(version.split('.')[0]) !== 7) throw new Error('Expected TypeScript 7, got ' + version);"
        yarn workspace arui-scripts exec tsc --version
        yarn run test
      env:
        CI: true

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: yarn install and lint
      run: |
        yarn install --immutable
        yarn run lint
      env:
        CI: true
