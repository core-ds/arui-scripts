name: Run tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: yarn install and test
      run: |
        yarn install --immutable
        yarn run test
        yarn test:start
      env:
        CI: true

  typescript-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript-version: ['6.0.2', '7.0.2']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Build arui-scripts
      run: |
        yarn install --immutable
        yarn build --filter=arui-scripts...
    - name: Test project TypeScript ${{ matrix.typescript-version }}
      run: |
        npm install --prefix "$RUNNER_TEMP/typescript-compat" --no-audit --no-fund --package-lock=false typescript@${{ matrix.typescript-version }}
        node packages/arui-scripts/test-typescript.js "$RUNNER_TEMP/typescript-compat/node_modules/typescript"

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: yarn install and lint
      run: |
        yarn install --immutable
        yarn run lint
      env:
        CI: true
