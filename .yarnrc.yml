approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmPublishRegistry: "https://registry.npmjs.org/"

# В TypeScript 7 нет JavaScript API, на котором работает typescript-eslint. Пакетам линтера отдаём
# отдельную копию TypeScript 6, а все остальное в монорепо работает на TypeScript 7.
# Расширения можно убрать, когда typescript-eslint начнет поддерживать TypeScript 7.
packageExtensions:
  "@typescript-eslint/eslint-plugin@*":
    dependencies:
      typescript: "npm:@typescript/typescript6@^6.0.0"
  "@typescript-eslint/parser@*":
    dependencies:
      typescript: "npm:@typescript/typescript6@^6.0.0"
  "@typescript-eslint/type-utils@*":
    dependencies:
      typescript: "npm:@typescript/typescript6@^6.0.0"
  "@typescript-eslint/typescript-estree@*":
    dependencies:
      typescript: "npm:@typescript/typescript6@^6.0.0"
  "ts-api-utils@*":
    dependencies:
      typescript: "npm:@typescript/typescript6@^6.0.0"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
